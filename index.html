<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex's Lab</title>
<meta name="description" content="A few things Alex has built: life-planning tools, simulations, 3D graphics and self-taught AI games.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath d=%27M25 6h14v18l15 26a6 6 0 0 1-5 9H15a6 6 0 0 1-5-9l15-26z%27 fill=%27%237c3aed%27/%3E%3Cpath d=%27M15 40h34l5 10a6 6 0 0 1-5 9H15a6 6 0 0 1-5-9z%27 fill=%27%23f472b6%27/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f6fb;
    --card: #ffffff;
    --edge: #e6e3ef;
    --ink: #1c1d26;
    --ink-dim: #5c6070;
    --ink-faint: #8a8ea0;
    --dot: rgba(90, 80, 140, .10);
    --shadow: 0 1px 2px rgba(30,20,60,.05), 0 8px 24px rgba(30,20,60,.06);
    /* per-group colours; each section overrides --g1/--g2 */
    --g1: #6366f1; --g2: #ec4899;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e16;
      --card: #161826;
      --edge: #262a3d;
      --ink: #eceef6;
      --ink-dim: #a6abbe;
      --ink-faint: #6f7489;
      --dot: rgba(160, 150, 255, .07);
      --shadow: 0 1px 2px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(var(--dot) 1px, transparent 1.5px) 0 0 / 22px 22px,
      var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* ---------- hero ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(120deg, #3b1d8f 0%, #6d28d9 38%, #c026d3 68%, #f97316 100%);
    border-radius: 0 0 28px 28px;
  }
  .hero .blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .55; pointer-events: none; }
  .hero .b1 { width: 340px; height: 340px; background: #22d3ee; top: -140px; right: 8%; animation: drift 18s ease-in-out infinite alternate; }
  .hero .b2 { width: 260px; height: 260px; background: #facc15; bottom: -150px; left: 35%; animation: drift 22s ease-in-out infinite alternate-reverse; }
  .hero .b3 { width: 220px; height: 220px; background: #10b981; top: 20%; left: -90px; animation: drift 26s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(40px, 30px) scale(1.15); } }
  .hero .wrap { position: relative; display: flex; align-items: center; gap: 26px; padding-top: 56px; padding-bottom: 52px; }
  .logo { flex: none; width: 112px; height: 112px; filter: drop-shadow(0 10px 24px rgba(30,0,60,.35)); }
  h1 { font-size: clamp(2.3rem, 7vw, 3.6rem); line-height: 1.05; margin: 0 0 10px; letter-spacing: -0.03em; font-weight: 800; }
  h1 span {
    background: linear-gradient(90deg, #fde047, #fb923c, #f472b6, #67e8f9, #fde047);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 8s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% 0; } }
  .intro { color: rgba(255,255,255,.88); max-width: 56ch; margin: 0; font-size: 1.15rem; }

  /* ---------- logo animation ---------- */
  .logo .bub { animation: rise 2.8s ease-in infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
  .logo .bub.d1 { animation-delay: .9s; animation-duration: 3.2s; }
  .logo .bub.d2 { animation-delay: 1.7s; animation-duration: 2.5s; }
  .logo .bub.d3 { animation-delay: 2.3s; animation-duration: 3.6s; }
  @keyframes rise {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-46px) scale(1.15); opacity: 0; }
  }
  .logo .spark { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .logo .spark.s2 { animation-delay: 1.2s; }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  .logo .liquid { animation: hue 10s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }

  /* ---------- groups ---------- */
  main { padding-top: 8px; }
  section { padding: 34px 0 6px; }
  .ghead { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .gdot {
    width: 38px; height: 38px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    box-shadow: 0 6px 16px color-mix(in srgb, var(--g1) 35%, transparent);
  }
  h2 { font-size: 1.25rem; margin: 0; line-height: 1.2; }
  .blurb { color: var(--ink-faint); margin: 2px 0 0; font-size: .95rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    --accent: var(--g1); --accent-2: var(--g2);
    --icon-bg: color-mix(in srgb, var(--g1) 13%, var(--card));
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 10px;
    padding: 20px 18px 18px;
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 16px;
    box-shadow: var(--shadow);
    color: inherit; text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
    background: linear-gradient(90deg, var(--g1), var(--g2));
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--g1) 55%, var(--edge));
    box-shadow: 0 14px 34px color-mix(in srgb, var(--g1) 28%, transparent);
    outline: none;
  }
  a.card:hover .icon { transform: rotate(-6deg) scale(1.06); }
  .card.soon { opacity: .62; cursor: default; }
  .icon {
    width: 58px; height: 58px; border-radius: 14px;
    background: var(--icon-bg);
    display: grid; place-items: center;
    transition: transform .2s ease;
  }
  .icon svg { width: 36px; height: 36px; }
  .card h3 { margin: 0; font-size: 1.05rem; }
  .card p { margin: 0; color: var(--ink-dim); font-size: .92rem; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: .75rem; padding: 2px 9px; border-radius: 99px;
    color: color-mix(in srgb, var(--g1) 75%, var(--ink));
    background: color-mix(in srgb, var(--g1) 10%, var(--card));
  }
  .badge {
    position: absolute; top: 16px; right: 14px;
    font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: #fff; padding: 3px 8px; border-radius: 99px;
    background: linear-gradient(90deg, var(--g1), var(--g2));
  }
  footer { padding: 48px 0 40px; color: var(--ink-faint); font-size: .85rem; text-align: center; }
  footer a { color: inherit; }

  @media (max-width: 560px) {
    .hero .wrap { flex-direction: column; align-items: flex-start; gap: 14px; padding-top: 36px; padding-bottom: 36px; }
    .logo { width: 84px; height: 84px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .logo .bub { opacity: .8; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="wrap">
    <svg class="logo" viewBox="0 0 120 120" role="img" aria-label="Lab flask logo">
      <defs>
        <linearGradient id="liq" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
        </linearGradient>
        <clipPath id="flaskIn"><path d="M50 30h20v24l23 38a8 8 0 0 1-7 12H34a8 8 0 0 1-7-12l23-38z"/></clipPath>
      </defs>
      <g clip-path="url(#flaskIn)">
        <rect x="20" y="30" width="80" height="80" fill="#fff" opacity=".18"/>
        <path class="liquid" d="M20 76c12-6 22 6 40 0s28-6 44 0V110H20z" fill="url(#liq)"/>
        <circle class="bub" cx="52" cy="96" r="4" fill="#fff"/>
        <circle class="bub d1" cx="66" cy="98" r="3" fill="#fff"/>
        <circle class="bub d2" cx="58" cy="100" r="2.5" fill="#fff"/>
        <circle class="bub d3" cx="72" cy="94" r="2" fill="#fff"/>
      </g>
      <path d="M50 30h20v24l23 38a8 8 0 0 1-7 12H34a8 8 0 0 1-7-12l23-38z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <rect x="45" y="22" width="30" height="9" rx="4.5" fill="#fff"/>
      <path d="M55 62l-9 15" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".6"/>
      <circle class="bub d1" cx="60" cy="18" r="3.5" fill="#fde047"/>
      <circle class="bub d3" cx="68" cy="14" r="2.5" fill="#67e8f9"/>
      <path class="spark" d="M95 24l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#fde047"/>
      <path class="spark s2" d="M24 40l1.8 4.2 4.2 1.8-4.2 1.8-1.8 4.2-1.8-4.2-4.2-1.8 4.2-1.8z" fill="#fff"/>
    </svg>
    <div>
      <h1>Alex's <span>Lab</span></h1>
      <p class="intro">A few things I've built</p>
    </div>
  </div>
</header>
<div class="wrap">
  <main id="groups"></main>
  <footer>Built with curiosity</footer>
</div>

<script src="apps.js"></script>
<script>
  // Small hand-drawn icons. currentColor = ink, var(--accent)/var(--accent-2) for highlights.
  const ICONS = {
    house: `<svg viewBox="0 0 36 36" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17L16 8l11 9" stroke="currentColor" stroke-width="2.2"/><path d="M8 15v13h16V15" stroke="currentColor" stroke-width="2.2"/><rect x="13.5" y="20" width="5" height="8" rx="1" fill="var(--accent-2)"/><path d="M28 9.5c0 3-4 7.5-4 7.5s-4-4.5-4-7.5a4 4 0 0 1 8 0z" fill="var(--accent)"/><circle cx="24" cy="9.5" r="1.5" fill="var(--card)"/></svg>`,
    mri: `<svg viewBox="0 0 36 36" fill="none" stroke-linecap="round"><rect x="4" y="4" width="28" height="28" rx="5" fill="#111827"/><ellipse cx="18" cy="18" rx="9" ry="11" stroke="#d1d5db" stroke-width="2"/><path d="M18 8v20" stroke="#9ca3af" stroke-width="1.2"/><path d="M12.5 13c2 1.5 3.5 1.5 5.5 0M18 13c2 1.5 3.5 1.5 5.5 0M12 19c2.2 1.4 4 1.4 6 0M18 19c2 1.4 3.8 1.4 6 0M13.5 24c1.6 1 3 1 4.5 0M18 24c1.5 1 2.9 1 4.5 0" stroke="#9ca3af" stroke-width="1.1"/><path d="M4 18h28" stroke="var(--accent-2)" stroke-width="1" opacity=".8"/></svg>`,
    juggler: `<svg viewBox="0 0 36 36"><defs><linearGradient id="jg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb7ff"/><stop offset=".55" stop-color="#3a5bd9"/><stop offset=".56" stop-color="#2f8f3a"/><stop offset="1" stop-color="#e6d23a"/></linearGradient></defs><path d="M2 30h32" stroke="currentColor" stroke-width="1.4" opacity=".3"/><g fill="var(--accent-2)" opacity=".35"><path d="M4 26h6l-1 4H2z"/><path d="M16 26h6l1 4h-8z"/><path d="M28 26h6l2 4h-7z"/></g><circle cx="18" cy="15" r="10" fill="url(#jg)"/><ellipse cx="14.5" cy="10.5" rx="3" ry="2" fill="#fff" opacity=".85"/></svg>`,
    finance: `<svg viewBox="0 0 36 36" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 31h26" stroke="currentColor" stroke-width="1.6" opacity=".35"/><g fill="var(--accent-2)"><rect x="7" y="22" width="4" height="6" rx="1"/><rect x="14" y="18" width="4" height="10" rx="1"/><rect x="21" y="14" width="4" height="14" rx="1"/></g><path d="M6 17l7-5 6 3 10-8" stroke="var(--accent)" stroke-width="2.4"/><path d="M24 7h5v5" stroke="var(--accent)" stroke-width="2.4"/></svg>`,
    boids: `<svg viewBox="0 0 36 36" fill="none"><g fill="var(--accent)"><path d="M6 20l7-3-2 6z"/><path d="M14 11l7-3-2 6z"/><path d="M20 22l7-3-2 6z"/></g><path d="M25 10l6-2-2 5z" fill="var(--accent-2)"/></svg>`,
    mandelbrot: `<svg viewBox="0 0 36 36"><circle cx="21" cy="18" r="8" fill="var(--accent)"/><circle cx="10.5" cy="18" r="3.5" fill="var(--accent)"/><circle cx="5.5" cy="18" r="1.4" fill="var(--accent)"/><circle cx="21" cy="8.5" r="2" fill="var(--accent-2)"/><circle cx="21" cy="27.5" r="2" fill="var(--accent-2)"/></svg>`,
    pendulum: `<svg viewBox="0 0 36 36" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M18 5L11 17L22 26" stroke="currentColor"/><circle cx="18" cy="5" r="2" fill="currentColor"/><circle cx="11" cy="17" r="3.2" fill="var(--accent)"/><circle cx="22" cy="26" r="3.2" fill="var(--accent-2)"/><path d="M6 28c4-6 10 2 16-6" stroke="var(--accent-2)" stroke-width="1.2" stroke-dasharray="2 2"/></svg>`,
    cells: `<svg viewBox="0 0 36 36"><g fill="var(--accent)"><rect x="4" y="22" width="5" height="8" rx="1.5"/><rect x="10.5" y="18" width="5" height="12" rx="1.5"/><rect x="17" y="14" width="5" height="16" rx="1.5"/></g><g fill="var(--accent-2)"><rect x="23.5" y="20" width="5" height="10" rx="1.5"/><rect x="30" y="8" width="3" height="22" rx="1.5" opacity=".6"/></g></svg>`,
    connect4: `<svg viewBox="0 0 36 36"><rect x="3" y="6" width="30" height="25" rx="3" fill="var(--accent-2)"/><g fill="var(--icon-bg)"><circle cx="10" cy="13" r="3"/><circle cx="18" cy="13" r="3"/><circle cx="26" cy="13" r="3"/><circle cx="10" cy="24" r="3"/></g><circle cx="18" cy="24" r="3" fill="var(--accent)"/><circle cx="26" cy="24" r="3" fill="#f2c94c"/></svg>`,
    othello: `<svg viewBox="0 0 36 36"><rect x="3" y="3" width="30" height="30" rx="3" fill="#2f8f5b"/><path d="M18 3v30M3 18h30" stroke="#246f47"/><circle cx="10.5" cy="10.5" r="5" fill="#fff"/><circle cx="25.5" cy="25.5" r="5" fill="#fff"/><circle cx="25.5" cy="10.5" r="5" fill="#111"/><circle cx="10.5" cy="25.5" r="5" fill="#111"/></svg>`,
    breakout: `<svg viewBox="0 0 36 36"><g fill="var(--accent)"><rect x="3" y="5" width="9" height="4" rx="1"/><rect x="13.5" y="5" width="9" height="4" rx="1"/><rect x="24" y="5" width="9" height="4" rx="1"/></g><g fill="var(--accent-2)"><rect x="3" y="10.5" width="9" height="4" rx="1"/><rect x="24" y="10.5" width="9" height="4" rx="1"/></g><circle cx="20" cy="21" r="2" fill="currentColor"/><rect x="11" y="28" width="12" height="3" rx="1.5" fill="currentColor"/></svg>`,
    tictactoe: `<svg viewBox="0 0 36 36" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M14 5v26M22 5v26M5 14h26M5 22h26" stroke="currentColor" opacity=".35"/><path d="M6.5 6.5l5 5M11.5 6.5l-5 5M24.5 24.5l5 5M29.5 24.5l-5 5" stroke="var(--accent)"/><circle cx="18" cy="18" r="2.6" stroke="var(--accent-2)"/></svg>`,
  };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function card(app) {
    const live = app.status === "live";
    const inner = `
      ${live ? "" : `<span class="badge">Coming soon</span>`}
      <div class="icon">${ICONS[app.icon] || ""}</div>
      <h3>${esc(app.name)}</h3>
      <p>${esc(app.desc)}</p>
      <div class="tags">${app.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;
    // Apps hosted elsewhere (e.g. Railway) open in a new tab.
    const external = /^https?:/.test(app.url) ? ' target="_blank" rel="noopener"' : "";
    return live
      ? `<a class="card" href="${esc(app.url)}"${external}>${inner}</a>`
      : `<div class="card soon" aria-disabled="true">${inner}</div>`;
  }

  // Each group gets its own colour pair, used by the heading, card stripes, icons and tags.
  const PALETTES = [
    ["#10b981", "#0ea5e9"],   // green -> sky
    ["#f97316", "#f43f5e"],   // orange -> rose
    ["#8b5cf6", "#ec4899"],   // violet -> pink
    ["#3b82f6", "#06b6d4"],   // blue -> cyan
    ["#eab308", "#f97316"],   // amber -> orange (spare for a 5th group)
  ];

  document.getElementById("groups").innerHTML = window.APPS.map((g, i) => {
    const [g1, g2] = PALETTES[i % PALETTES.length];
    return `
    <section style="--g1:${g1};--g2:${g2}">
      <div class="ghead">
        <div class="gdot"></div>
        <div><h2>${esc(g.group)}</h2><p class="blurb">${esc(g.blurb)}</p></div>
      </div>
      <div class="grid">${g.items.map(card).join("")}</div>
    </section>`;
  }).join("");
</script>
</body>
</html>
